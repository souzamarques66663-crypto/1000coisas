name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v4
        with:
          enablement: enable
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./
      - uses: actions/deploy-pages@v5
