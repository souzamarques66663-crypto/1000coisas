name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to gh-pages
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b gh-pages || git checkout gh-pages
          git rm -rf . || true
          git checkout main -- index.html styles.css script.js checkout.html cart.html product.html logo.svg README_SITE.md
          git add .
          git commit -m "Deploy site to gh-pages" || echo "No changes"
          git push --force origin gh-pages
      - name: Enable GitHub Pages
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/souzamarques66663-crypto/1000coisas/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || echo "Pages may already be enabled"
