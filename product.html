<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Produto — 1000 Coisas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">
          <img src="logo.svg" alt="1000 Coisas" />
        </a>
        <nav class="main-nav" aria-label="Navegação principal">
          <a href="index.html#produtos">Produtos</a>
          <a href="index.html#ofertas">Ofertas</a>
          <a href="index.html#contato">Contato</a>
        </nav>
        <div class="actions">
          <a class="btn-primary" href="cart.html">Carrinho</a>
        </div>
      </div>
    </header>

    <main class="container section">
      <div id="product-root" class="product-page">
        <div class="product-grid">
          <div class="product-media card" id="product-media">
            <!-- imagem/svg -->
          </div>
          <div class="product-info card">
            <h1 id="product-name">Produto</h1>
            <p id="product-price">R$ 0,00</p>
            <p id="product-desc">Descrição do produto.</p>
            <div class="product-actions">
              <button id="add-to-cart" class="btn-primary">Adicionar ao carrinho</button>
              <a href="checkout.html" class="btn-ghost">Ir para checkout</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div><strong>1000 Coisas</strong><p>Atendimento 24/7</p></div>
        <div><p>© <span id="year3"></span> 1000 Coisas.</p></div>
      </div>
    </footer>

    <script src="script.js" defer></script>
    <script>
      // Inicializa product page após carregar script.js
      document.addEventListener('DOMContentLoaded', ()=>{
        const params = new URLSearchParams(location.search);
        const sku = params.get('sku') || 'x1000';
        if(window.renderProductPage) window.renderProductPage(sku);
      });
    </script>
  </body>
</html>
