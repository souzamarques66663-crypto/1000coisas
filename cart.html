<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Carrinho — 1000 Coisas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">
          <img src="logo.svg" alt="1000 Coisas" />
        </a>
        <nav class="main-nav" aria-label="Navegação principal">
          <a href="index.html#produtos">Produtos</a>
          <a href="index.html#ofertas">Ofertas</a>
          <a href="index.html#contato">Contato</a>
        </nav>
        <div class="actions">
          <a class="btn-primary" href="index.html">Continuar comprando</a>
        </div>
      </div>
    </header>

    <main class="container section">
      <h1>Seu Carrinho</h1>
      <div class="card">
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-totals">
          <div>Subtotal</div>
          <div id="cart-subtotal">R$ 0,00</div>
        </div>
        <div style="margin-top:1rem;display:flex;gap:.6rem">
          <a class="btn-primary" href="checkout.html">Finalizar compra</a>
          <button class="btn-outline" id="clear-cart-page">Limpar carrinho</button>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div><strong>1000 Coisas</strong><p>Atendimento 24/7</p></div>
        <div><p>© <span id="year4"></span> 1000 Coisas.</p></div>
      </div>
    </footer>

    <script src="script.js" defer></script>
    <script>
      document.addEventListener('DOMContentLoaded', ()=>{
        if(window.renderCartPage) window.renderCartPage();
      });
    </script>
  </body>
</html>
